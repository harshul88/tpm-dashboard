name: Deploy to AWS (S3 + CloudFront)

# Replaces deploy.yml (GitHub Pages) once Phase 4 CDK stack is deployed.
#
# Prerequisites before this workflow can run:
#   1. CDK stack deployed in Dev1 (188348131654, us-east-1)
#   2. AWS_ROLE_ARN secret set in repo settings (GitHubActionsDeployRole ARN from cdk deploy output)
#   3. GitHub environments "staging" and "production" created in repo settings
#   4. "production" environment configured with a required reviewer protection rule

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC token exchange with AWS
  contents: read

jobs:
  # ─── BUILD ────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── DEPLOY TO STAGING ────────────────────────────────────────────────────
  # Auto-deploys on every merge to main. No approval gate.
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Read deploy targets from SSM
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name /tpm-dashboard/staging/bucket-name \
            --query Parameter.Value --output text)
          CF_ID=$(aws ssm get-parameter \
            --name /tpm-dashboard/staging/cloudfront-id \
            --query Parameter.Value --output text)
          echo "BUCKET=$BUCKET" >> $GITHUB_ENV
          echo "CF_ID=$CF_ID" >> $GITHUB_ENV

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ env.BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          # index.html must not be cached so users always get the latest shell
          aws s3 cp dist/index.html s3://${{ env.BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CF_ID }} \
            --paths "/*"

  # ─── DEPLOY TO PRODUCTION ─────────────────────────────────────────────────
  # Requires manual approval via the "production" GitHub environment.
  # Set a required reviewer in repo Settings → Environments → production.
  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Read deploy targets from SSM
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name /tpm-dashboard/prod/bucket-name \
            --query Parameter.Value --output text)
          CF_ID=$(aws ssm get-parameter \
            --name /tpm-dashboard/prod/cloudfront-id \
            --query Parameter.Value --output text)
          echo "BUCKET=$BUCKET" >> $GITHUB_ENV
          echo "CF_ID=$CF_ID" >> $GITHUB_ENV

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://${{ env.BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://${{ env.BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CF_ID }} \
            --paths "/*"
