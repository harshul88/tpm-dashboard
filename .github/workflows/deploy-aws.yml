name: Deploy to AWS (S3 + CloudFront)

# Required secrets — configure in repo Settings → Secrets and variables → Actions:
#   AWS_ROLE_ARN : ARN of GitHubActionsDeployRole (from `cdk deploy` Outputs.GitHubActionsRoleArn)
#   STAGING_URL  : CloudFront staging domain      (from `cdk deploy` Outputs.StagingDomain)
#   PROD_URL     : CloudFront production domain   (from `cdk deploy` Outputs.ProdDomain)
#
# Required GitHub environments — configure in repo Settings → Environments:
#   staging    : no approval required (auto-deploys on merge to main)
#   production : add a required reviewer to gate prod deploys

on:
  push:
    branches: [main]     # → staging
    tags: ['v*.*.*']     # → production

permissions:
  id-token: write  # Required for OIDC token exchange with AWS STS
  contents: read

jobs:
  # ─── STAGING ──────────────────────────────────────────────────────────────
  # Auto-deploys on every merge to main.
  # cancel-in-progress: true — a new push supersedes any in-flight staging deploy.
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: ${{ secrets.STAGING_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          # Long-lived immutable cache for hashed assets; no-cache for index.html
          # so users always receive the latest app shell on next visit.
          aws s3 sync dist/ s3://tpm-dashboard-staging \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://tpm-dashboard-staging/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          CF_ID=$(aws ssm get-parameter \
            --name /tpm-dashboard/staging/cloudfront-id \
            --query Parameter.Value --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$CF_ID" \
            --paths "/*"

      - name: Smoke test
        run: |
          echo "Waiting 30s for CloudFront propagation..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test FAILED — expected 200, got $STATUS"
            exit 1
          fi
          echo "Smoke test PASSED"

  # ─── PRODUCTION ───────────────────────────────────────────────────────────
  # Triggers on version tags (v*.*.*). The "production" GitHub environment
  # must have a required reviewer configured — that approval gate is what
  # separates staging auto-deploy from a deliberate prod promotion.
  #
  # cancel-in-progress: false — a prod deploy in flight is never cancelled.
  # Tag a new version to queue a follow-up deploy after the current one lands.
  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      ENVIRONMENT: production

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL: ${{ secrets.PROD_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync dist/ s3://tpm-dashboard-prod \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html s3://tpm-dashboard-prod/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          CF_ID=$(aws ssm get-parameter \
            --name /tpm-dashboard/prod/cloudfront-id \
            --query Parameter.Value --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$CF_ID" \
            --paths "/*"

      - name: Smoke test
        run: |
          echo "Waiting 30s for CloudFront propagation..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_URL }}")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test FAILED — expected 200, got $STATUS"
            exit 1
          fi
          echo "Smoke test PASSED"
