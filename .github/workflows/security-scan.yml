name: Security Scan

on:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Check if AI review is requested
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
            if ! echo "$LABELS" | grep -q "ai-review"; then
              echo "Label 'ai-review' not found. Skipping AI review."
              exit 0
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Check for .env files in PR diff
        run: |
          ENV_FILES=$(git diff origin/${{ github.base_ref }}...HEAD --name-only \
            | grep -E '(^|/)\.(env)(\.[^/]*)?$' \
            | grep -v '\.env\.example$' \
            || true)
          if [ -n "$ENV_FILES" ]; then
            echo "ERROR: .env file(s) detected in this PR:"
            echo "$ENV_FILES"
            echo "Remove them and rotate any secrets that may have been exposed."
            exit 1
          fi
          echo ".env check passed — no environment files found in diff."

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript
